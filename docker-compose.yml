# BimGuesser lokal im Container: docker compose up --build → http://localhost:3000
# (Server-Deployment siehe deploy/compose.snippet.yml – dort kommt das fertige Image von ghcr.io)
services:
  bimguesser:
    build: .
    image: bimguesser:local
    init: true # Signale sauber weiterreichen (schnelles docker stop)
    restart: unless-stopped
    mem_limit: 768m
    ports:
      - '${PORT:-3000}:3000'
    environment:
      - APP_VERSION=local
      # Accounts: Passwort-Reset-Mails gehen an Mailpit (ansehen: http://localhost:8025)
      - SMTP_URL=smtp://mailpit:1025
      - MAIL_FROM=BimGuesser <noreply@bimguesser.local>
      - PUBLIC_URL=http://localhost:${PORT:-3000}
    volumes:
      - state:/app/state # Auskunfts-Cache, Statistik, Accounts (accounts.db)
    depends_on:
      - mailpit

  # fängt alle Mails ab (nur lokal – kein echter Versand)
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '8025:8025'

volumes:
  state:
