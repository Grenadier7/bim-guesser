# In ~/docker/compose.yml unter "services:" einfügen.
# Dazu in ~/docker/.env:
#   NGROK_AUTHTOKEN=…            (ngrok-Dashboard → Your Authtoken)
#   NGROK_DOMAIN=…ngrok-free.dev (ngrok-Dashboard → Domains, ohne https://)
#   SMTP_URL=smtps://benutzer:passwort@mail.example.org:465   (für „Passwort vergessen“, optional)
#   MAIL_FROM=BimGuesser <noreply@deine-domain.at>
#   CONTACT_EMAIL=…              (Kontakt im Datenschutz-Hinweis; optional – sonst die Adresse aus MAIL_FROM)

  # --- ÖFFI-GUESSER ---
  oeffi-guesser:
    image: ghcr.io/grenadier7/bim-guesser:latest
    container_name: oeffi-guesser
    restart: unless-stopped
    mem_limit: 768m
    environment:
      # Accounts – Passwort vergessen per E-Mail (ohne SMTP_URL ist „Passwort vergessen“ aus, alles andere geht)
      - PUBLIC_URL=https://${NGROK_DOMAIN}
      - SMTP_URL=${SMTP_URL:-}
      - MAIL_FROM=${MAIL_FROM:-BimGuesser <noreply@example.org>}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-}
    volumes:
      - ./services/oeffi-guesser/state:/app/state # Auskunfts-Cache, Statistik, Accounts (accounts.db – mitsichern!)
    networks:
      - proxy_network

  oeffi-ngrok:
    image: ngrok/ngrok:latest
    container_name: oeffi-ngrok
    restart: unless-stopped
    command: ['http', 'oeffi-guesser:3000', '--url', '${NGROK_DOMAIN}']
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - oeffi-guesser
    networks:
      - proxy_network
